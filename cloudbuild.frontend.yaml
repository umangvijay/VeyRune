timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - frontend/Dockerfile.frontend
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - -t
      - ${_FRONTEND_IMAGE}
      - frontend
images:
  - ${_FRONTEND_IMAGE}
substitutions:
  _API_URL: 'https://REPLACE_API_HOST/api/v1'
  _FRONTEND_IMAGE: 'us-central1-docker.pkg.dev/${PROJECT_ID}/veyrune/frontend:latest'
